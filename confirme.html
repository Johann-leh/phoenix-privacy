<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phoenix Arise — Compte confirmé</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #2D0A0A 0%, #6B1A1A 40%, #C1440E 75%, #E8732A 100%);
    padding: 24px;
  }
  .card {
    background: #F5EDD8;
    border-radius: 24px;
    padding: 40px 32px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .check {
    width: 72px; height: 72px;
    border-radius: 50%;
    background: #2D6A4F;
    color: #fff;
    font-size: 38px;
    line-height: 72px;
    margin: 0 auto 24px;
  }
  h1 { font-size: 26px; color: #1A0A0A; margin-bottom: 14px; letter-spacing: 0.3px; }
  p { font-size: 16px; color: #6B1A1A; line-height: 1.6; margin-bottom: 12px; }
  .sous { font-size: 14px; color: #7A6A5A; margin-top: 24px; }
  .marque { margin-top: 32px; font-size: 13px; color: #C1440E; font-weight: 700; letter-spacing: 3px; }
</style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>Ton compte est confirmé</h1>
    <p>Tu peux maintenant retourner dans l'application Phoenix Arise et te connecter.</p>
    <p class="sous">Tu peux fermer cette page.</p>
    <div class="marque">PHOENIX ARISE</div>
  </div>
</body>
</html>
